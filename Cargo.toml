[workspace]
resolver = "2"
members = ["crates/sim", "crates/data", "crates/tui", "crates/tools"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ContractorKeith/pioneer-trail"
authors = ["Keith Bloemendaal <keith@dutchbuiltnc.com>"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
toml = "0.8"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
include_dir = "0.7"
ratatui = "0.29"
crossterm = "0.28"
insta = "1"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
