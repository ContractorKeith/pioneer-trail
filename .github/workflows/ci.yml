name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p pioneer-tools --bin event-lint
      - name: sim crate has no terminal deps
        run: |
          if cargo tree -p pioneer-sim | grep -Eq 'ratatui|crossterm'; then
            echo "pioneer-sim must not depend on ratatui/crossterm"; exit 1; fi
