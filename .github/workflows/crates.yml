name: crates

# Manual crates.io publish. Run after the matching vX.Y.Z GitHub release.
# Requires the CARGO_REGISTRY_TOKEN repository secret (publish-new + publish-update scopes).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify only; do not upload
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require registry token
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::CARGO_REGISTRY_TOKEN secret is not set"; exit 1; }
      # --workspace publishes pioneer-sim, pioneer-data, pioneer-trail in dependency
      # order and waits for each to index; pioneer-tools is publish = false.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --workspace --locked --dry-run
          else
            cargo publish --workspace --locked
          fi
