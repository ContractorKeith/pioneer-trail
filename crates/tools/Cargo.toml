[package]
name = "pioneer-tools"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
description = "Dev tools for Pioneer Trail: px-preview, balance-report, event-lint."

[[bin]]
name = "event-lint"
path = "src/event_lint.rs"

[[bin]]
name = "px-preview"
